name: Supabase Keepalive Ping

on:
  schedule:
    # Бесплатный пинг раз в 3 дня (08:00 UTC), чтобы проект Supabase Free не засыпал
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bochka-quest Supabase REST endpoint
        run: |
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNldmNtc3lwd29obXBldGh5YnpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTU0OTksImV4cCI6MjExMDA3MTQ5OX0.YOCD9vaqv9-FV2X28xLnzYt1x_NOGRW6wqsCBcw34Bk"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "https://cevcmsypwohmpethybzf.supabase.co/rest/v1/global_stats?select=id&limit=1")
          echo "Supabase keepalive HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi
